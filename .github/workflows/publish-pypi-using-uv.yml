name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      # Use this version of github actions
      - uses: actions/checkout@v4

      # We want to use python3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Building the package
      - name: build release distributions
        run: |
          python -m pip install uv
          python -m uv build

      - name: upload windows dists
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    # Puslish it using OpenID Connect
    # see: https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-pypi
    # and: https://github.com/pypa/gh-action-pypi-publish
    runs-on: ubuntu-latest
    needs:
      - release-build
    environment:
      name: pypi
      url: https://pypi.org/p/xlum
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
